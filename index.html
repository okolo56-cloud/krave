<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EventFlow — Plan, Register & Check In</title>
<style>
:root{--g:#1d78f2;--d:#0b2d63;--bg:#eaf3ff;--l:#cfe0f7;--muted:#54708f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#10233d;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.nav{height:70px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 6%;gap:10px;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:800;color:var(--d);flex:1}.nav button,.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.nav button{background:#eef5ff}.hero{padding:72px 7% 55px;background:linear-gradient(135deg,#2f80ed,#dcecff);text-align:center}.eyebrow{color:#1359b9;font-size:11px;font-weight:800;letter-spacing:.14em}.hero h1{font-size:clamp(40px,6vw,68px);letter-spacing:-3px;line-height:1.02;margin:12px auto 18px;max-width:820px;color:#0b2d63}.hero h1 span{color:#0b5fd1}.hero p{max-width:700px;margin:auto;color:#365776;line-height:1.7;font-size:16px}.hero-actions{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.primary{background:var(--d);color:white}.green{background:#dcecff;color:#0b5fd1}.wrap{max-width:1100px;margin:auto;padding:45px 20px}.section-title{text-align:center;margin-bottom:22px}.section-title h2{font-size:30px;margin:0 0 8px}.section-title p{color:var(--muted);margin:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:45px}.step,.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:23px}.step-number{width:38px;height:38px;border-radius:11px;background:#e1efff;color:#125fbe;display:grid;place-items:center;font-weight:800}.step h3{margin:15px 0 7px}.muted{color:var(--muted);line-height:1.55}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.event h3{font-size:21px;margin:15px 0 8px}.pill{display:inline-block;background:#e1efff;color:#125fbe;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:700}.details{display:grid;gap:8px;color:var(--muted);font-size:13px;margin:18px 0}.full{width:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px}.stat b{font-size:28px;display:block;margin-top:5px}.table{background:#fff;border:1px solid var(--l);border-radius:15px;overflow:auto}.row{display:grid;grid-template-columns:1.3fr 1.3fr 1.2fr .8fr;min-width:650px;gap:10px;padding:14px 18px;border-bottom:1px solid var(--l);align-items:center}.head{background:#f4f8fd;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.ok{color:var(--g);font-weight:700}.modal{position:fixed;inset:0;background:#09264aaa;display:grid;place-items:center;padding:20px;z-index:10}.box{background:#fff;border-radius:18px;padding:24px;width:min(500px,100%)}.form{display:grid;gap:14px}.form label{font-size:12px;font-weight:700}.form input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--l);border-radius:9px}.ticket{border:1px dashed #7fa7d8;border-radius:14px;padding:20px;margin-top:15px}.ticket strong{font-size:22px;display:block;letter-spacing:2px;margin:14px 0}.dates{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}.date-card{background:#fff;border:1px solid var(--l);border-radius:15px;padding:20px;display:grid;grid-template-columns:74px 1fr;gap:18px;align-items:center}.date-badge{background:#e1efff;border-radius:14px;padding:12px;text-align:center;color:#125fbe}.date-badge b{display:block;font-size:28px}.date-badge span{font-size:11px;font-weight:800;text-transform:uppercase}.date-card h3{margin:0 0 7px}.date-card p{margin:5px 0;color:var(--muted);font-size:13px}.date-actions{display:flex;gap:8px;margin-top:12px}.edit-btn{background:#0b2d63;color:#fff;border:0;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700}.cancel-btn{background:#eef5ff;color:#0b2d63;border:0;border-radius:9px;padding:9px 12px}.host-top{display:flex;justify-content:space-between;align-items:end;gap:20px}.host-top h1{margin:8px 0}.mini{font-size:12px;color:var(--muted)}footer{padding:25px 7%;border-top:1px solid var(--l);color:var(--muted);font-size:12px}@media(max-width:700px){.steps,.cards,.stats,.dates{grid-template-columns:1fr}.nav{padding:0 4%}.nav button{padding:9px;font-size:12px}.hero{padding:55px 5%}.date-card{grid-template-columns:62px 1fr}}
</style></head>
<body><div id="app"></div>
<script>
const EK='ef-events',AK='ef-attendees';
let events=JSON.parse(localStorage.getItem(EK)||'null')||[{id:'1',name:'Future Founders Summit',date:'2026-09-12',time:'09:00',location:'Lagos Innovation Hall',capacity:350,description:'Ideas, startups, products and community.'},{id:'2',name:'Design & Product Night',date:'2026-09-26',time:'17:30',location:'The Atrium, Lagos',capacity:180,description:'Meet designers and product builders.'}];
let people=JSON.parse(localStorage.getItem(AK)||'null')||[];
const save=()=>{localStorage.setItem(EK,JSON.stringify(events));localStorage.setItem(AK,JSON.stringify(people))};
const esc=x=>String(x).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function nav(){return `<header class="nav"><div class="brand">✦ EventFlow</div><button onclick="home()">Home</button><button onclick="citizen()">Register</button><button onclick="host()">Host Portal</button></header>`}
function page(x){document.getElementById('app').innerHTML=nav()+x+`<footer>EventFlow · Plan events, register easily and check in smoothly.</footer>`}
function home(){page(`<section class="hero"><div class="eyebrow">WELCOME TO EVENTFLOW</div><h1>Plan events. <span>Register simply.</span> Welcome everyone smoothly.</h1><p>EventFlow is an event planning and registration platform that helps hosts organize events and helps citizens register without confusion. Start here to learn how registration works.</p><div class="hero-actions"><button class="btn primary" onclick="citizen()">Find an event →</button><button class="btn green" onclick="document.getElementById('how').scrollIntoView({behavior:'smooth'})">How registration works</button></div></section><main class="wrap" id="how"><div class="section-title"><h2>How to register</h2><p>It only takes a few simple steps.</p></div><div class="steps"><div class="step"><div class="step-number">1</div><h3>Choose an event</h3><p class="muted">Browse available events and select the one you want to attend.</p></div><div class="step"><div class="step-number">2</div><h3>Enter your details</h3><p class="muted">Provide your full name, email address and phone number.</p></div><div class="step"><div class="step-number">3</div><h3>Get your ticket</h3><p class="muted">After submitting the form, you receive a registration ID for arrival.</p></div></div><div class="section-title"><h2>Why use EventFlow?</h2><p>Everything is designed to make event attendance easier.</p></div><div class="cards"><div class="card"><h3>For citizens</h3><p class="muted">See event details, register quickly and receive confirmation.</p></div><div class="card"><h3>For hosts</h3><p class="muted">Plan events, view registration dates and keep track of attendees.</p></div></div></main>`)}
function citizen(){page(`<section class="hero"><div class="eyebrow">CITIZEN REGISTRATION</div><h1>Choose an event and <span>sign up.</span></h1><p>Review the event details, click Sign up and complete the short registration form.</p></section><main class="wrap"><div class="cards">${events.map(e=>`<article class="card event"><span class="pill">OPEN FOR REGISTRATION</span><h3>${esc(e.name)}</h3><p class="muted">${esc(e.description)}</p><div class="details"><span>📅 ${e.date} · ${e.time}</span><span>📍 ${esc(e.location)}</span><span>👥 Capacity: ${e.capacity}</span></div><button class="btn primary full" onclick="signup('${e.id}')">Sign up for this event →</button></article>`).join('')}</div></main>`)}
function signup(id){let e=events.find(x=>x.id===id);page(`<main class="wrap"><div class="card"><button class="btn green" onclick="citizen()">← Back to events</button><h2>Sign up for ${esc(e.name)}</h2><p class="muted">Complete the form below. Your information will be sent to the event host.</p><form class="form" onsubmit="submitSignup(event,'${e.id}')"><label>Full name<input name="name" placeholder="Your full name" required></label><label>Email<input name="email" type="email" placeholder="you@example.com" required></label><label>Phone number<input name="phone" placeholder="Your phone number" required></label><button class="btn primary">Complete registration ✓</button></form></div></main>`)}
function submitSignup(ev,id){ev.preventDefault();let f=new FormData(ev.target),a={id:'EF-'+Math.random().toString(36).slice(2,8).toUpperCase(),eventId:id,name:f.get('name'),email:f.get('email'),phone:f.get('phone'),checked:false};people.unshift(a);save();let e=events.find(x=>x.id===id);page(`<main class="wrap"><div class="card"><span class="pill">REGISTRATION COMPLETE</span><h2>You're registered 🎉</h2><p class="muted">Your registration has been recorded for the event host.</p><div class="ticket"><span>EVENTFLOW REGISTRATION ID</span><strong>${a.id}</strong><p>${esc(a.name)}<br>${esc(e.name)}<br>${e.date} · ${e.time}<br>${esc(e.location)}</p></div><br><button class="btn primary full" onclick="citizen()">Browse more events</button></div></main>`)}
function host(){const checked=people.filter(x=>x.checked).length;page(`<main class="wrap"><div class="host-top"><div><span class="pill">HOST AREA</span><h1>Host Dashboard</h1><p class="muted">Plan your events, review event dates and see who has registered.</p></div><div class="mini">${new Date().toLocaleDateString()}</div></div><div class="stats"><div class="stat">Events<b>${events.length}</b></div><div class="stat">Sign-ups<b>${people.length}</b></div><div class="stat">Checked in<b>${checked}</b></div></div><div class="card"><div class="section-title"><h2>Event Dates</h2><p>All scheduled events, dates, times and locations. You can change the schedule anytime.</p></div><div class="dates">${events.map(e=>{const d=new Date(e.date+'T12:00:00');return `<article class="date-card"><div class="date-badge"><b>${String(d.getDate()).padStart(2,'0')}</b><span>${d.toLocaleDateString('en-US',{month:'short'})}</span></div><div><h3>${esc(e.name)}</h3><p>📅 ${e.date}</p><p>🕒 ${e.time}</p><p>📍 ${esc(e.location)}</p><p>👥 ${e.capacity} capacity</p><div class="date-actions"><button class="edit-btn" onclick="editEvent('${e.id}')">✎ Change date & time</button></div></div></article>`}).join('')}</div></div><br><div class="card"><h2>Citizen registrations</h2><div class="table"><div class="row head"><span>Name</span><span>Email</span><span>Event</span><span>Status</span></div>${people.length?people.map(a=>{let e=events.find(x=>x.id===a.eventId);return `<div class="row"><strong>${esc(a.name)}</strong><span>${esc(a.email)}</span><span>${esc(e?.name||'Unknown')}</span><span class="${a.checked?'ok':''}">${a.checked?'✓ Checked in':'Registered'}</span></div>`}).join(''):'<div style="padding:25px" class="muted">No citizens have signed up yet.</div>'}</div></div></main>`)}
function editEvent(id){const e=events.find(x=>x.id===id);if(!e)return;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="editModal"><div class="box"><button class="cancel-btn" style="float:right" onclick="closeEdit()">×</button><h2>Change event schedule</h2><p class="muted">Update when the event will happen. Citizens will see the new date and time after saving.</p><form class="form" onsubmit="saveEventEdit(event,'${e.id}')"><label>Event date<input type="date" name="date" value="${e.date}" required></label><label>Event time<input type="time" name="time" value="${e.time}" required></label><button class="btn primary full">Save new date & time ✓</button></form></div></div>`)}
function closeEdit(){document.getElementById('editModal')?.remove()}
function saveEventEdit(ev,id){ev.preventDefault();const f=new FormData(ev.target),e=events.find(x=>x.id===id);if(!e)return;e.date=f.get('date');e.time=f.get('time');save();closeEdit();host()}
home();
</script></body></html>
