<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventFlow — Seamless event management</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#f6f7f4;--surface:#fff;--ink:#152019;--muted:#6c756f;--line:#e4e8e3;--accent:#0e8f61;--accent2:#dff7eb;--dark:#17372a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5.5%;gap:38px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:20px}.brandmark{width:32px;height:32px;border-radius:10px;background:var(--dark);color:#b8f5d7;display:grid;place-items:center}.topbar nav{display:flex;gap:8px;flex:1}.topbar nav button{border:0;background:none;color:var(--muted);padding:9px 13px;border-radius:9px;font-weight:600}.topbar nav button.active,.topbar nav button:hover{background:#f1f5f1;color:var(--ink)}.avatar{width:36px;height:36px;border-radius:50%;border:0;background:#e9eee9;font-weight:700}.hero{padding:70px 7% 58px;display:grid;grid-template-columns:1.25fr .75fr;gap:50px;background:linear-gradient(135deg,#edf8f2,#f8faf6)}.eyebrow{font-size:11px;letter-spacing:.13em;font-weight:700;color:var(--accent);margin:0 0 11px}.hero h1{font-family:'Space Grotesk';font-size:clamp(42px,5vw,68px);line-height:.98;letter-spacing:-.045em;margin:0;max-width:760px}.hero h1 span{color:var(--accent)}.sub{color:var(--muted);line-height:1.6;max-width:680px;font-size:16px}.hero-actions{display:flex;gap:12px;margin-top:28px}.primary,.secondary,.small-btn,.check-btn,.undo-btn,.text-btn,.icon-btn{border:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700}.primary{background:var(--dark);color:#fff;padding:12px 17px}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink);padding:11px 16px}.full{width:100%}.hero-card{align-self:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;align-items:center;gap:17px;box-shadow:0 15px 45px #19372a0d}.scan-orb{width:78px;height:78px;border-radius:18px;background:var(--accent2);display:grid;place-items:center;color:var(--accent);font-size:34px}.hero-card strong{font-size:18px}.hero-card p{color:var(--muted);margin:5px 0 0}.live{margin-left:auto;font-size:12px;color:var(--accent);display:flex;gap:6px;align-items:center}.live i{width:7px;height:7px;border-radius:50%;background:var(--accent)}.content{max-width:1180px;margin:0 auto;padding:55px 28px 70px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.section-head h2{font-family:'Space Grotesk';font-size:30px;margin:0;letter-spacing:-.03em}.text-btn{background:none;color:var(--accent);padding:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel,.event-card{background:#fff;border:1px solid var(--line);border-radius:16px}.stat{padding:18px;display:flex;align-items:center;gap:13px}.stat-icon{width:40px;height:40px;border-radius:11px;background:#f0f6f1;display:grid;place-items:center;color:var(--accent);font-size:19px}.stat span,.stat strong{display:block}.stat span{font-size:12px;color:var(--muted);margin-bottom:4px}.stat strong{font-size:24px;font-family:'Space Grotesk'}.grid2{display:grid;grid-template-columns:1.55fr .75fr;gap:20px}.panel{padding:22px}.panel-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}.panel h3,.event-card h3{font-family:'Space Grotesk';margin:0 0 5px;font-size:18px}.panel p{margin:0;color:var(--muted);font-size:13px}.icon-btn{width:34px;height:34px;background:#f3f5f2;color:var(--ink)}.event-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}.event-row:last-child{border-bottom:0}.date-box{width:48px;height:54px;border-radius:10px;background:#eef8f2;display:grid;place-content:center;text-align:center}.date-box b{font-size:18px;font-family:'Space Grotesk'}.date-box span{text-transform:uppercase;font-size:9px;color:var(--accent);font-weight:700}.event-info{flex:1;min-width:0}.event-info strong,.event-info span{display:block}.event-info strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-info span{color:var(--muted);font-size:12px;margin-top:4px}.event-count{text-align:right}.event-count b,.event-count span{display:block}.event-count b{font-size:15px}.event-count span{font-size:10px;color:var(--muted)}.small-btn{padding:8px 10px;background:#f0f5f1;color:var(--dark);font-size:12px}.spotlight{background:var(--dark);color:#fff}.spotlight p{color:#b9c8c1}.spot-head{display:flex;gap:11px;align-items:center}.mini-icon{width:38px;height:38px;background:#2b5141;border-radius:10px;display:grid;place-items:center;color:#b8f5d7}.big-number{font-family:'Space Grotesk';font-size:52px;margin:28px 0 12px}.big-number span{font-size:18px;color:#9bb0a5}.progress{height:7px;border-radius:9px;background:#365646;overflow:hidden}.progress span{display:block;height:100%;background:#74e1ad;border-radius:9px}.muted{font-size:12px;margin-top:8px}.spotlight .primary{background:#b8f5d7;color:#123a29;margin-top:22px}.event-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.event-card{padding:22px}.event-card-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}.pill{background:#e8f7ef;color:var(--accent);font-size:11px;font-weight:700;padding:6px 9px;border-radius:999px}.event-card h3{font-size:22px;margin-top:22px}.event-card p{color:var(--muted);line-height:1.5;min-height:42px}.event-details{display:grid;gap:9px;margin:20px 0;color:var(--muted);font-size:12px}.event-details span{display:flex;gap:8px;align-items:center}.check-summary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 15px;text-align:center}.check-summary b,.check-summary span{display:block}.check-summary b{font-size:22px;font-family:'Space Grotesk'}.check-summary span{font-size:10px;color:var(--muted)}.search{height:48px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 15px;margin-bottom:14px;color:var(--muted)}.search input{border:0;outline:0;flex:1;background:transparent}.table-panel{padding:0;overflow:hidden}.table-head,.attendee{display:grid;grid-template-columns:2fr .8fr 1fr .7fr;align-items:center;gap:12px;padding:14px 20px}.table-head{background:#f8faf8;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.attendee{border-top:1px solid var(--line)}.person{display:flex;align-items:center;gap:11px}.avatar.small{width:35px;height:35px;font-size:11px;background:#e7f2ec;color:var(--dark);display:grid;place-items:center}.person strong,.person span{display:block}.person strong{font-size:13px}.person span{font-size:11px;color:var(--muted);margin-top:3px}.ticket-tag{font-size:11px;font-weight:700}.status{font-size:11px;font-weight:700}.status.done{color:var(--accent)}.status.pending{color:#9a7b30}.check-btn{background:var(--dark);color:#fff;padding:8px 11px;font-size:11px}.undo-btn{background:#f0f2f0;color:#55605a;padding:8px 11px;font-size:11px}.empty{padding:30px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);padding:25px 7%;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.overlay{position:fixed;inset:0;background:#0c181290;display:grid;place-items:center;padding:20px;z-index:30}.modal{background:#fff;border-radius:18px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 30px 80px #0003}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-head h3{font-family:'Space Grotesk';font-size:22px;margin:0}.form{display:grid;gap:14px}.form label{font-size:12px;font-weight:700;display:grid;gap:7px}.form input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:0}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.register-banner{display:flex;gap:9px;align-items:center;padding:12px;background:#eef8f2;color:var(--dark);border-radius:10px;font-size:12px}.ticket{border:1px dashed #b7c5bc;border-radius:15px;padding:20px}.ticket-top{display:flex;justify-content:space-between;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.1em}.qr{font-size:64px;line-height:1}.ticket h3{font-family:'Space Grotesk';font-size:25px;margin:25px 0 5px}.ticket p{color:var(--muted);margin-top:0}.ticket-meta{display:grid;gap:8px;color:var(--muted);font-size:11px;margin:20px 0}.ticket-id{display:block;letter-spacing:.15em;font-family:'Space Grotesk';font-size:18px;margin-bottom:18px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 15px 35px #0003;z-index:50;font-size:13px}@media(max-width:850px){.hero{grid-template-columns:1fr;padding:50px 6%}.stats{grid-template-columns:1fr 1fr}.grid2,.event-grid{grid-template-columns:1fr}.topbar{padding:0 4%;gap:12px}.topbar nav{overflow:auto}.content{padding:40px 16px}.table-head{display:none}.attendee{grid-template-columns:1fr auto;gap:10px}.attendee>.ticket-tag,.attendee>.status{display:none}}@media(max-width:520px){.hero h1{font-size:42px}.stats{grid-template-columns:1fr}.hero-actions{flex-direction:column}.form-row{grid-template-columns:1fr}footer{flex-direction:column;gap:8px}.event-count{display:none}.small-btn{display:none}}</style></head><body><div id="app"></div><script>
const seedEvents=[{id:'evt-101',title:'Future Founders Summit',date:'2026-09-12',time:'09:00',location:'Lagos Innovation Hall',capacity:350,registered:218,status:'Published',description:'A day of ideas, startups, product and community.'},{id:'evt-102',title:'Design & Product Night',date:'2026-09-26',time:'17:30',location:'The Atrium, Lagos',capacity:180,registered:96,status:'Published',description:'Meet designers and product builders shaping what comes next.'}];
const seedAttendees=[{id:'AT-7K2P9',eventId:'evt-101',name:'Ada Okafor',email:'ada@example.com',ticket:'VIP',checkedIn:true},{id:'AT-4M8Q1',eventId:'evt-101',name:'Tunde Bello',email:'tunde@example.com',ticket:'General',checkedIn:false},{id:'AT-9N3R5',eventId:'evt-101',name:'Chioma Eze',email:'chioma@example.com',ticket:'General',checkedIn:false}];
let events=JSON.parse(localStorage.getItem('eventflow-events')||'null')||seedEvents,attendees=JSON.parse(localStorage.getItem('eventflow-attendees')||'null')||seedAttendees,tab='overview',toastTimer;const save=()=>{localStorage.setItem('eventflow-events',JSON.stringify(events));localStorage.setItem('eventflow-attendees',JSON.stringify(attendees))};const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),2800)}function shell(content){document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand"><div class="brandmark">✦</div><span>EventFlow</span></div><nav><button class="${tab==='overview'?'active':''}" onclick="setTab('overview')">Overview</button><button class="${tab==='events'?'active':''}" onclick="setTab('events')">Events</button><button class="${tab==='checkin'?'active':''}" onclick="setTab('checkin')">Check-in</button></nav><button class="avatar">DO</button></header>${tab==='overview'?`<section class="hero"><div><p class="eyebrow">EVENT MANAGEMENT, SIMPLIFIED</p><h1>From registration to <span>check-in</span>, effortlessly.</h1><p class="sub">One clean workspace for creating events, collecting registrations, issuing digital tickets and welcoming guests at the door.</p><div class="hero-actions"><button class="primary" onclick="openCreate()">＋ Create event</button><button class="secondary" onclick="setTab('checkin')">⌗ Open check-in</button></div></div><div class="hero-card"><div class="scan-orb">⌗</div><div><strong>Fast door check-in</strong><p>Search a guest or scan their ticket.</p></div><span class="live"><i></i> Live</span></div></section>`:''}<section class="content">${content}</section><footer><span>EventFlow</span><span>Built for hosts who care about the guest experience.</span></footer>`}function setTab(t){tab=t;render()}function render(){if(tab==='overview')return overview();if(tab==='events')return eventList();return checkin()}function overview(){const total=events.reduce((a,e)=>a+e.registered,0),checked=attendees.filter(a=>a.checkedIn).length;shell(`<div class="section-head"><div><p class="eyebrow">HOST DASHBOARD</p><h2>Good morning 👋</h2></div><button class="text-btn" onclick="setTab('events')">View all events →</button></div><div class="stats"><div class="stat"><div class="stat-icon">▣</div><div><span>Upcoming events</span><strong>${events.length}</strong></div></div><div class="stat"><div class="stat-icon">♟</div><div><span>Total registrations</span><strong>${total}</strong></div></div><div class="stat"><div class="stat-icon">✓</div><div><span>Checked in</span><strong>${checked}</strong></div></div><div class="stat"><div class="stat-icon">◷</div><div><span>Avg. check-in</span><strong>12 sec</strong></div></div></div><div class="grid2"><div class="panel"><div class="panel-head"><div><h3>Upcoming events</h3><p>Keep an eye on your next experiences.</p></div><button class="icon-btn" onclick="openCreate()">＋</button></div>${events.slice(0,3).map(eventRow).join('')}</div><div class="panel spotlight"><div class="spot-head"><div class="mini-icon">✓</div><div><h3>Door mode</h3><p>Ready for your next attendee.</p></div></div><div class="big-number">${checked}<span> / ${attendees.length}</span></div><div class="progress"><span style="width:${attendees.length?Math.min(100,checked/attendees.length*100):0}%"></span></div><p class="muted">Guests checked in</p><button class="primary full" onclick="setTab('checkin')">Start check-in →</button></div></div>`)}function eventRow(e){const d=new Date(e.date+'T12:00');return `<div class="event-row"><div class="date-box"><b>${String(d.getDate()).padStart(2,'0')}</b><span>${d.toLocaleDateString('en-US',{month:'short'})}</span></div><div class="event-info"><strong>${esc(e.title)}</strong><span>${esc(e.time)} · ${esc(e.location)}</span></div><div class="event-count"><b>${e.registered}</b><span>registered</span></div><button class="small-btn" onclick="openRegister('${e.id}')">Register</button></div>`}function eventList(){shell(`<div class="section-head"><div><p class="eyebrow">EVENTS</p><h2>Your events</h2></div><button class="primary" onclick="openCreate()">＋ New event</button></div><div class="event-grid">${events.map(e=>`<div class="event-card"><div class="event-card-top"><span class="pill">${e.status}</span><span>▣</span></div><h3>${esc(e.title)}</h3><p>${esc(e.description)}</p><div class="event-details"><span>▣ ${esc(e.date)} · ${esc(e.time)}</span><span>⌖ ${esc(e.location)}</span><span>♟ ${e.registered}/${e.capacity} guests</span></div><button class="secondary full" onclick="openRegister('${e.id}')">Open registration →</button></div>`).join('')}</div>`)}function checkin(){const q=window.checkQ||'',list=attendees.filter(a=>!q||[a.name,a.email,a.id].some(v=>v.toLowerCase().includes(q.toLowerCase())));shell(`<div class="section-head"><div><p class="eyebrow">DOOR MODE</p><h2>Check in guests</h2><p class="sub" style="font-size:13px">Search by name, email or ticket ID. One tap confirms arrival.</p></div><div class="check-summary"><b>${attendees.filter(a=>a.checkedIn).length}</b><span>checked in</span></div></div><div class="search">⌕<input value="${esc(q)}" oninput="window.checkQ=this.value;checkin()" placeholder="Search attendee or ticket ID..."></div><div class="panel table-panel"><div class="table-head"><span>Attendee</span><span>Ticket</span><span>Status</span><span></span></div>${list.map(a=>`<div class="attendee"><div class="person"><div class="avatar small">${a.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div><strong>${esc(a.name)}</strong><span>${esc(a.email)} · ${a.id}</span></div></div><span class="ticket-tag">${a.ticket}</span><span class="status ${a.checkedIn?'done':'pending'}">${a.checkedIn?'✓ Checked in':'Waiting'}</span><button class="${a.checkedIn?'undo-btn':'check-btn'}" onclick="toggleCheck('${a.id}')">${a.checkedIn?'Undo':'Check in'}</button></div>`).join('')||'<div class="empty">No attendees match your search.</div>'}</div>`)}function modal(title,body){document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">×</button></div>${body}</div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}function openCreate(){modal('Create an event',`<form class="form" onsubmit="createEvent(event)"><label>Event name<input name="title" placeholder="e.g. Community Tech Night" required></label><div class="form-row"><label>Date<input type="date" name="date" required></label><label>Time<input type="time" name="time" required></label></div><label>Location<input name="location" placeholder="Venue or address" required></label><div class="form-row"><label>Capacity<input type="number" name="capacity" min="1" value="100" required></label><label>Description<input name="description" placeholder="What should guests know?"></label></div><button class="primary full">Publish event →</button></form>`)}function createEvent(ev){ev.preventDefault();const f=new FormData(ev.target);events.unshift({id:'evt-'+Date.now(),title:f.get('title'),date:f.get('date'),time:f.get('time'),location:f.get('location'),capacity:Number(f.get('capacity')),registered:0,status:'Published',description:f.get('description')||''});save();closeModal();toast('Event published successfully.');render()}function openRegister(id){const e=events.find(x=>x.id===id);modal('Register for '+esc(e.title),`<form class="form" onsubmit="register(event,'${e.id}')"><div class="register-banner">✓ <span>Your digital ticket will be generated instantly.</span></div><label>Full name<input name="name" placeholder="Your name" required></label><label>Email<input type="email" name="email" placeholder="you@example.com" required></label><button class="primary full">Complete registration ✓</button></form>`)}function register(ev,eventId){ev.preventDefault();const f=new FormData(ev.target),a={id:'AT-'+Math.random().toString(36).slice(2,7).toUpperCase(),eventId,name:f.get('name'),email:f.get('email'),ticket:'General',checkedIn:false};attendees.unshift(a);events=events.map(e=>e.id===eventId?{...e,registered:e.registered+1}:e);save();closeModal();toast('Registration complete — ticket ready.');showTicket(a)}function showTicket(a){const e=events.find(x=>x.id===a.eventId);modal("You're registered!",`<div class="ticket"><div class="ticket-top"><span>EVENTFLOW PASS</span><div class="qr">▦</div></div><h3>${esc(e.title)}</h3><p>${esc(a.name)} · ${a.ticket}</p><div class="ticket-meta"><span>▣ ${e.date} · ${e.time}</span><span>⌖ ${esc(e.location)}</span></div><strong class="ticket-id">${a.id}</strong><button class="secondary full" onclick="toast('Ticket saved to your browser.')">⇩ Save ticket</button></div>`)}function toggleCheck(id){attendees=attendees.map(a=>a.id===id?{...a,checkedIn:!a.checkedIn}:a);save();toast('Check-in status updated.');render()}render();
</script></body></html>
