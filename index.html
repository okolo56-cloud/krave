<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventFlow</title><style>:root{--g:#0b8759;--d:#12372a;--bg:#f5f8f5;--l:#dfe7e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17231c;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.nav{height:70px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 6%;gap:10px}.brand{font-size:22px;font-weight:800;color:var(--d);flex:1}.nav button,.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.nav button{background:#eef5f0}.hero{text-align:center;padding:70px 7%;background:linear-gradient(135deg,#e8f7ef,#fff)}h1{font-size:clamp(40px,6vw,68px);letter-spacing:-3px;margin:0 0 18px}.hero span{color:var(--g)}.hero p{max-width:650px;margin:auto;color:#68736c;line-height:1.6}.wrap{max-width:1100px;margin:auto;padding:45px 20px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:23px}.card h2{margin-top:0}.event h3{font-size:21px;margin:15px 0 8px}.muted{color:#68736c;line-height:1.5}.pill{display:inline-block;background:#e3f6eb;color:#087248;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:700}.details{display:grid;gap:8px;color:#68736c;font-size:13px;margin:18px 0}.primary{background:var(--d);color:white}.green{background:#e1f5ea;color:#087248}.full{width:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px}.stat b{font-size:28px;display:block;margin-top:5px}.table{background:#fff;border:1px solid var(--l);border-radius:15px;overflow:auto}.row{display:grid;grid-template-columns:1.3fr 1.3fr 1.2fr .8fr;min-width:650px;gap:10px;padding:14px 18px;border-bottom:1px solid var(--l);align-items:center}.head{background:#f7faf8;color:#68736c;font-size:11px;font-weight:800;text-transform:uppercase}.ok{color:var(--g);font-weight:700}.modal{position:fixed;inset:0;background:#092016aa;display:grid;place-items:center;padding:20px}.box{background:#fff;border-radius:18px;padding:24px;width:min(500px,100%)}.close{float:right;border:0;background:#edf1ee;border-radius:8px;width:32px;height:32px}.form{display:grid;gap:14px}.form label{font-size:12px;font-weight:700}.form input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--l);border-radius:9px}.ticket{border:1px dashed #9bb6a7;border-radius:14px;padding:20px;margin-top:15px}.ticket strong{font-size:22px;display:block;letter-spacing:2px;margin:14px 0}footer{padding:25px 7%;border-top:1px solid var(--l);color:#68736c;font-size:12px}@media(max-width:700px){.cards,.stats{grid-template-columns:1fr}.nav{padding:0 4%}.nav button{padding:9px;font-size:12px}}</style></head><body><div id="app"></div><script>const EK='ef-events',AK='ef-attendees';let events=JSON.parse(localStorage.getItem(EK)||'null')||[{id:'1',name:'Future Founders Summit',date:'2026-09-12',time:'09:00',location:'Lagos Innovation Hall',capacity:350,description:'Ideas, startups, products and community.'},{id:'2',name:'Design & Product Night',date:'2026-09-26',time:'17:30',location:'The Atrium, Lagos',capacity:180,description:'Meet designers and product builders.'}];let people=JSON.parse(localStorage.getItem(AK)||'null')||[];const save=()=>{localStorage.setItem(EK,JSON.stringify(events));localStorage.setItem(AK,JSON.stringify(people))};const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nav(){return `<header class="nav"><div class="brand">✦ EventFlow</div><button onclick="citizen()">Citizen Portal</button><button onclick="host()">Host Portal</button></header>`}function page(x){app.innerHTML=nav()+x+`<footer>EventFlow · Seamless event registration and check-in</footer>`}function citizen(){page(`<section class="hero"><h1>Register for events <span>easily.</span></h1><p>Choose an event, enter your details and get your registration ticket instantly.</p></section><main class="wrap"><h2>Available events</h2><div class="cards">${events.map(e=>`<article class="card event"><span class="pill">OPEN</span><h3>${esc(e.name)}</h3><p class="muted">${esc(e.description)}</p><div class="details"><span>📅 ${e.date} · ${e.time}</span><span>📍 ${esc(e.location)}</span><span>👥 Capacity: ${e.capacity}</span></div><button class="btn primary full" onclick="signup('${e.id}')">Sign up →</button></article>`).join('')}</div></main>`)}function signup(id){let e=events.find(x=>x.id===id);page(`<main class="wrap"><div class="card"><button class="btn green" onclick="citizen()">← Events</button><h2>Sign up for ${esc(e.name)}</h2><form class="form" onsubmit="submitSignup(event,'${e.id}')"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone number<input name="phone" required></label><button class="btn primary">Complete registration ✓</button></form></div></main>`)}function submitSignup(ev,id){ev.preventDefault();let f=new FormData(ev.target),a={id:'EF-'+Math.random().toString(36).slice(2,8).toUpperCase(),eventId:id,name:f.get('name'),email:f.get('email'),phone:f.get('phone'),checked:false};people.unshift(a);save();let e=events.find(x=>x.id===id);page(`<main class="wrap"><div class="card"><h2>Registration successful 🎉</h2><p class="muted">Your registration has been sent to the host.</p><div class="ticket"><span>EVENTFLOW TICKET</span><strong>${a.id}</strong><p>${esc(a.name)}<br>${esc(e.name)}<br>${e.date} · ${e.time}<br>${esc(e.location)}</p></div><br><button class="btn primary full" onclick="citizen()">Back to events</button></div></main>`)}function host(){page(`<main class="wrap"><div class="card"><span class="pill">PRIVATE HOST AREA</span><h1>Host Dashboard</h1><p class="muted">See everyone who wants to attend your events.</p></div><div class="stats"><div class="stat">Events<b>${events.length}</b></div><div class="stat">Sign-ups<b>${people.length}</b></div><div class="stat">Checked in<b>${people.filter(x=>x.checked).length}</b></div></div><div class="card"><h2>Citizen registrations</h2><div class="table"><div class="row head"><span>Name</span><span>Email</span><span>Event</span><span>Status</span></div>${people.length?people.map(a=>{let e=events.find(x=>x.id===a.eventId);return `<div class="row"><strong>${esc(a.name)}</strong><span>${esc(a.email)}</span><span>${esc(e?.name||'Unknown')}</span><span class="${a.checked?'ok':''}">${a.checked?'✓ Checked in':'Registered'}</span></div>`}).join(''):'<div style="padding:25px" class="muted">No citizens have signed up yet.</div>'}</div></div></main>`)}citizen();</script></body></html>
